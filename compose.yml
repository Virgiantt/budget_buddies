# Production stack for Budget Buddies.
#
#   cd /opt/budget-buddies && docker compose up -d
#
# Database: SQLite. File DB tinggal DI DALAM volume app-storage
# (/var/www/html/storage/database/database.sqlite), bukan di dalam image,
# jadi tidak hilang saat image di-rebuild atau container di-recreate.
#
# Reads ./.env (same folder as this file). Only nginx is published, and only
# on loopback: 127.0.0.1:44000 -> container:80. Nothing is reachable from the
# internet directly; put a reverse proxy (or an SSH tunnel) in front of it.

name: budget-buddies

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: budget-buddies:${IMAGE_TAG:-latest}
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  env_file:
    - .env
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    LOG_CHANNEL: stderr
    DB_CONNECTION: sqlite
    DB_DATABASE: /var/www/html/storage/database/database.sqlite
    DB_FOREIGN_KEYS: "true"
    CACHE_STORE: database
    SESSION_DRIVER: database
    QUEUE_CONNECTION: database
  volumes:
    - app-storage:/var/www/html/storage
  logging: *logging

services:
  app:
    <<: *app
    build:
      context: .
      target: app

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    stop_grace_period: 30s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]

  web:
    image: budget-buddies-web:${IMAGE_TAG:-latest}
    build:
      context: .
      target: web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${APP_PORT:-44000}:80"
    volumes:
      - app-storage:/var/www/html/storage:ro
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      app:
        condition: service_started

volumes:
  app-storage:
