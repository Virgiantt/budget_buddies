name: budget-buddies

services:
  app:
    build:
      context: .
      target: app
    image: budget-buddies:latest
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Budget Buddies}
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env.production}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?Set APP_URL in .env.production}
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-budget_buddies}
      DB_USERNAME: ${DB_USERNAME:-budget_buddies}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - app-storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  queue:
    image: budget-buddies:latest
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment: &laravel-environment
      APP_NAME: ${APP_NAME:-Budget Buddies}
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env.production}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?Set APP_URL in .env.production}
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-budget_buddies}
      DB_USERNAME: ${DB_USERNAME:-budget_buddies}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    image: budget-buddies:latest
    restart: unless-stopped
    command: php artisan schedule:work
    environment: *laravel-environment
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.7
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-budget_buddies}
      MARIADB_USER: ${DB_USERNAME:-budget_buddies}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.production}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  app-storage:
  db-data:
